# Etapa 4.4 — uma ServiceAccount por workload, SEM token montado.
# Antes: todos os pods do app usavam a SA "default" com o token da API montado em
# /var/run/secrets/kubernetes.io/serviceaccount (CIS 5.1.5/5.1.6). Nenhuma app do
# TipsBank fala com a API do Kubernetes: uma RCE na api-contas entregaria uma
# credencial da API ao invasor sem necessidade.
# - automountServiceAccountToken: false na SA e no pod (defesa dupla).
# - Nenhum RoleBinding para estas SAs: identidade sem permissao.
# - A SA "default" de cada namespace tambem deixa de montar token (pod futuro que
#   esquecer o serviceAccountName nao ganha credencial).
# Tokens, quando precisar (ex.: teste ou um job externo): `kubectl create token`
# (TokenRequest: curto, assinado, com audiencia) — nunca Secret do tipo
# kubernetes.io/service-account-token (legado, nao expira).
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: api-contas, namespace: tipsbank-contas, labels: {app: api-contas, team: contas}}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: postgres, namespace: tipsbank-contas, labels: {app: postgres, team: contas}}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: api-transacoes, namespace: tipsbank-transacoes, labels: {app: api-transacoes, team: transacoes}}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: auditoria, namespace: tipsbank-auditoria, labels: {app: auditoria, team: auditoria}}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: web, namespace: tipsbank-web, labels: {app: web, team: web}}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: locust, namespace: tipsbank-loadtest, labels: {app: locust, team: plataforma}}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: default, namespace: tipsbank-contas}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: default, namespace: tipsbank-transacoes}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: default, namespace: tipsbank-auditoria}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: default, namespace: tipsbank-web}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: default, namespace: tipsbank-loadtest}
automountServiceAccountToken: false
