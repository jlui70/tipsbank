# web: SPA + proxy reverso (nginx-unprivileged, UID 101). nginx.conf vem do ConfigMap web-nginx-conf.
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: tipsbank-web
  labels: {app.kubernetes.io/name: web, app.kubernetes.io/part-of: tipsbank}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: web}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: tipsbank-web
  labels: {app.kubernetes.io/name: web, app.kubernetes.io/part-of: tipsbank, role: frontend,
           app: web, team: web, env: producao}
spec:
  # replicas: definido pelo HPA (hpa.yaml, etapa 3.7). Não volte a fixar aqui.
  selector:
    matchLabels: {app.kubernetes.io/name: web}
  template:
    metadata:
      labels: {app.kubernetes.io/name: web, app.kubernetes.io/part-of: tipsbank, role: frontend}
      annotations:
        # muda quando o nginx.conf muda -> força rollout (o nginx só lê a config no start)
        tipsbank.io/nginx-conf-sha: "414f1bbf64dd"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      # 3.3: PREFERE espalhar as réplicas por nodes diferentes (preferred: se não houver node
      # livre, o pod sobe mesmo assim no mesmo node — não trava o deploy nem o HPA da 3.7)
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector: {matchLabels: {app.kubernetes.io/name: web}}
                topologyKey: kubernetes.io/hostname
      containers:
        - name: app
          image: ghcr.io/jlui70/tipsbank-web:v1.0.0@sha256:852f48826838c0de6a5dd73880ef13c151464f6f26bdc2ae90f5d9423b966ded
          ports:
            - {name: http, containerPort: 8080}
          volumeMounts:
            - {name: nginx-conf, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf, readOnly: true}
            - {name: tmp, mountPath: /tmp}          # pid + temp paths do nginx (raiz é read-only)
          securityContext:
            runAsUser: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          lifecycle:
            preStop:
              sleep: {seconds: 5}   # 3.2: segura o SIGTERM até o ingress-nginx/kube-proxy tirarem o pod dos endpoints
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 200m, memory: 64Mi}
      volumes:
        - name: nginx-conf
          configMap: {name: web-nginx-conf}
        - name: tmp
          emptyDir: {}
