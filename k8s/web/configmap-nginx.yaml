# nginx.conf do web (montado em /etc/nginx/nginx.conf). Imagem web:v1.0.0 assinada fica intacta.
# Etapa 2.1 (Ingress puro): o proxy /api/* saiu daqui. As chamadas da SPA para /api/<serviço>/*
# são roteadas pelo Ingress NGINX direto para cada API (k8s/<ns>/ingress.yaml, Ingress *-spa).
# Efeitos: um salto a menos, o web não depende mais dos Services das APIs no start
# (antes: "host not found in upstream" no boot) e não precisa de egress para elas (NetPol 2.5).
apiVersion: v1
data:
  nginx.conf: |
    # nginx config pro frontend TipsBank no Kubernetes.
    # - Serve os arquivos estaticos em /
    # - /api/* nao chega aqui: o Ingress roteia direto para as APIs

    worker_processes auto;
    pid /tmp/nginx.pid;

    events {
      worker_connections 1024;
    }

    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;
      sendfile on;
      keepalive_timeout 65;

      # nginx-unprivileged (user 101) precisa dessas paths gravaveis
      client_body_temp_path /tmp/client_body;
      proxy_temp_path       /tmp/proxy;
      fastcgi_temp_path     /tmp/fastcgi;
      uwsgi_temp_path       /tmp/uwsgi;
      scgi_temp_path        /tmp/scgi;

      server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # health check propria do frontend
        location = /healthz {
          access_log off;
          return 200 "ok\n";
        }

        # SPA fallback — qualquer rota que nao achar, volta pro index.html
        location / {
          try_files $uri $uri/ /index.html;
        }
      }
    }
kind: ConfigMap
metadata:
  name: web-nginx-conf
  namespace: tipsbank-web
