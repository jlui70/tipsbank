# api-transacoes: chama api-contas e auditoria (outros namespaces) e grava no Postgres.
# Pod multicontainer (1.5): app grava /var/log/app/app.log; sidecar log-forwarder faz tail -F do arquivo.
# Etapa 2.4 (canary): esta é a v1. Service e Deployment selecionam também version: v1, para não
# pegarem os pods da v2 (api-transacoes-v2.yaml), que têm o mesmo app.kubernetes.io/name.
# O selector de um Deployment é imutável: a mudança exigiu recriar o Deployment (ver EVIDENCIAS 2.4).
apiVersion: v1
kind: Service
metadata:
  name: api-transacoes
  namespace: tipsbank-transacoes
  labels: {app.kubernetes.io/name: api-transacoes, app.kubernetes.io/part-of: tipsbank}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: api-transacoes, version: v1}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-transacoes
  namespace: tipsbank-transacoes
  labels: {app.kubernetes.io/name: api-transacoes, app.kubernetes.io/part-of: tipsbank, role: app, version: v1}
spec:
  replicas: 2
  revisionHistoryLimit: 5       # 3.2: guarda os 5 ReplicaSets anteriores para o rollout undo
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1               # sobe 1 pod novo por vez, além das 2 réplicas
      maxUnavailable: 0         # nunca derruba um pod antigo antes de um novo ficar Ready
  selector:
    matchLabels: {app.kubernetes.io/name: api-transacoes, version: v1}
  template:
    metadata:
      labels: {app.kubernetes.io/name: api-transacoes, app.kubernetes.io/part-of: tipsbank, role: app, version: v1}
      annotations:
        tipsbank.io/log-config-sha: "7ec289c99786"   # muda com o configmap-log.yaml -> força rollout
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532         # nonroot do Distroless
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      # 3.3: PREFERE espalhar as réplicas por nodes diferentes (preferred: se não houver node
      # livre, o pod sobe mesmo assim no mesmo node — não trava o deploy nem o HPA da 3.7)
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector: {matchLabels: {app.kubernetes.io/name: api-transacoes}}
                topologyKey: kubernetes.io/hostname
      containers:
        - name: app              # nome fixo: o HPA ContainerResource (Semana 3) referencia "app"
          image: ghcr.io/jlui70/tipsbank-api-transacoes:v1.0.0@sha256:415945fea3f0cd8e69fb4e736e6f071bde7ad948783a22b09c30aac7c12a2c6e
          args: [--log-config, /etc/app/log-config.json]   # somado ao ENTRYPOINT (python3 -m uvicorn ...)
          ports:
            - {name: http, containerPort: 8080}
          env:
            - name: DB_URL
              valueFrom: {secretKeyRef: {name: transacoes-db, key: DB_URL}}
            - name: CONTAS_URL
              valueFrom: {configMapKeyRef: {name: transacoes-config, key: CONTAS_URL}}
            - name: AUDITORIA_URL
              valueFrom: {configMapKeyRef: {name: transacoes-config, key: AUDITORIA_URL}}
            - name: APP_VERSION
              valueFrom: {configMapKeyRef: {name: transacoes-config, key: APP_VERSION}}
            - name: LOG_LEVEL
              valueFrom: {configMapKeyRef: {name: transacoes-config, key: LOG_LEVEL}}
          securityContext:
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          lifecycle:
            preStop:
              sleep: {seconds: 5}   # 3.2: segura o SIGTERM até o ingress-nginx/kube-proxy tirarem o pod dos endpoints
          startupProbe:
            httpGet: {path: /health/startup, port: http}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - {name: app-logs, mountPath: /var/log/app}
            - {name: log-config, mountPath: /etc/app, readOnly: true}
        # Sidecar: lê o log que a app grava no volume compartilhado e publica no stdout dele
        # (kubectl logs -c log-forwarder). Mesmo padrão de um agente de logs (Fluent Bit etc.).
        - name: log-forwarder
          image: busybox:1.37@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: [sh, -c, 'exec tail -n +1 -F /var/log/app/app.log']
          securityContext:
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          livenessProbe:
            exec: {command: [pidof, tail]}
            periodSeconds: 30
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {cpu: 50m, memory: 32Mi}
          volumeMounts:
            - {name: app-logs, mountPath: /var/log/app, readOnly: true}
      volumes:
        - name: app-logs
          emptyDir: {sizeLimit: 50Mi}   # compartilhado pelos 2 containers; some com o pod
        - name: log-config
          configMap: {name: transacoes-log-config}
