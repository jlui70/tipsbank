# Etapa 2.4 — api-transacoes v2 (canary). Mesma configuração da v1 (api-transacoes.yaml),
# com 3 diferenças:
#   1. imagem v2.0.0 (APP_VERSION=v2 no build + endpoint mock GET /pix);
#   2. label version: v2 (o Service e o Deployment da v1 selecionam version: v1, então não se misturam);
#   3. sem a variável APP_VERSION do ConfigMap: na v1 ela vale "v1" e sobrescreveria a da imagem.
# O tráfego chega aqui pelo Ingress canário (ingress-canary.yaml): 10% por peso ou X-Canary: true.
apiVersion: v1
kind: Service
metadata:
  name: api-transacoes-v2
  namespace: tipsbank-transacoes
  labels: {app.kubernetes.io/name: api-transacoes, app.kubernetes.io/part-of: tipsbank, version: v2, tipsbank.io/job: api-transacoes}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: api-transacoes, version: v2}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-transacoes-v2
  namespace: tipsbank-transacoes
  labels: {app.kubernetes.io/name: api-transacoes, app.kubernetes.io/part-of: tipsbank, role: app, version: v2,
           app: api-transacoes, team: transacoes, env: producao}
spec:
  replicas: 1                    # o canary recebe 10% do tráfego: uma réplica basta
  selector:
    matchLabels: {app.kubernetes.io/name: api-transacoes, version: v2}
  template:
    metadata:
      labels: {app.kubernetes.io/name: api-transacoes, app.kubernetes.io/part-of: tipsbank, role: app, version: v2}
      annotations:
        tipsbank.io/log-config-sha: "7ec289c99786"
    spec:
      serviceAccountName: api-transacoes                # etapa 4.4: SA propria, sem token (a app nao usa a API do Kubernetes)
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app
          image: ghcr.io/jlui70/tipsbank-api-transacoes:v2.2.0@sha256:b0d43d2056718a35488c544f7dd96c988a991e4ce8d040ac13f4d1247a36d5ed
          args: [--log-config, /etc/app/log-config.json]
          ports:
            - {name: http, containerPort: 8080}
          env:
            - name: DB_URL
              valueFrom: {secretKeyRef: {name: transacoes-db, key: DB_URL}}
            - name: CONTAS_URL
              valueFrom: {configMapKeyRef: {name: transacoes-config, key: CONTAS_URL}}
            - name: AUDITORIA_URL
              valueFrom: {configMapKeyRef: {name: transacoes-config, key: AUDITORIA_URL}}
            - name: LOG_LEVEL
              valueFrom: {configMapKeyRef: {name: transacoes-config, key: LOG_LEVEL}}
            - name: DB_POOL_SIZE
              valueFrom: {configMapKeyRef: {name: transacoes-config, key: DB_POOL_SIZE}}
            - name: DB_MAX_OVERFLOW
              valueFrom: {configMapKeyRef: {name: transacoes-config, key: DB_MAX_OVERFLOW}}
          securityContext:
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          lifecycle:
            preStop:
              sleep: {seconds: 5}   # 3.2: segura o SIGTERM até o ingress-nginx/kube-proxy tirarem o pod dos endpoints
          startupProbe:
            httpGet: {path: /health/startup, port: http}
            periodSeconds: 5
            failureThreshold: 30
          # 3.7: timeouts calibrados no stress test. Com timeoutSeconds: 1 (padrão), sob CPU saturada o
          # /health/live (def síncrono, mesmo pool de threads das requisições) passava de 1 s e o kubelet
          # MATAVA pods ocupados, não travados: 28 restarts e conexões cortadas na 1ª rodada do Locust.
          # Readiness tira o pod lento do balanceamento; liveness só reinicia após ~60 s sem resposta.
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests: {cpu: 100m, memory: 128Mi}   # 3.4: valores do manual (uso medido: ~3m / ~70Mi)
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - {name: app-logs, mountPath: /var/log/app}
            - {name: log-config, mountPath: /etc/app, readOnly: true}
        - name: log-forwarder
          image: ghcr.io/jlui70/mirror/busybox:1.37@sha256:66a6306db78bf2dbf3487f293aa8d6990d8e506fdffab9cc43fe422becf886e4
          command: [sh, -c, 'exec tail -n +1 -F /var/log/app/app.log']
          securityContext:
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          livenessProbe:
            exec: {command: [pidof, tail]}
            periodSeconds: 30
          resources:
            requests: {cpu: 10m, memory: 16Mi}     # 3.4: valores do manual
            limits: {cpu: 50m, memory: 32Mi}
          volumeMounts:
            - {name: app-logs, mountPath: /var/log/app, readOnly: true}
      volumes:
        - name: app-logs
          emptyDir: {sizeLimit: 50Mi}
        - name: log-config
          configMap: {name: transacoes-log-config}
