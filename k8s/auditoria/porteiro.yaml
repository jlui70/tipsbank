# Complemento de seguranca (achado em 2026-11-07): POST /eventos da auditoria exposto pelo
# Ingress sem autenticacao -> qualquer um na internet podia FORJAR eventos na trilha de
# auditoria. Quem grava eventos e a api-transacoes, direto pelo Service (NetPol 2.5).
# O SPA so LE (GET /eventos, GET /arquivos).
#
# O ingress-nginx nao filtra por metodo sem server-snippet (desligado: e o vetor do
# CVE-2025-1974, IngressNightmare). Solucao sem mudar a app: autenticacao externa
# (annotation auth-url) apontando para este "porteiro". Para cada requisicao da location
# protegida, o controller faz uma sub-requisicao a /auth com o cabecalho X-Original-Method;
# 2xx = segue, 401/403 = o cliente recebe 403. Libera GET/HEAD; nega o resto.
#
# Imagem: a NOSSA ghcr.io/jlui70/tipsbank-web (nginx-unprivileged, assinada, Trivy) com outro
# nginx.conf (este ConfigMap). 2 replicas: se o porteiro cair, a auditoria fica fechada (403),
# e nao aberta (fail-closed).
apiVersion: v1
kind: ConfigMap
metadata:
  name: auditoria-porteiro-conf
  namespace: tipsbank-auditoria
  labels: {app.kubernetes.io/name: auditoria-porteiro, app.kubernetes.io/part-of: tipsbank}
data:
  nginx.conf: |
    worker_processes 1;
    pid /tmp/nginx.pid;
    events { worker_connections 256; }
    http {
      server_tokens off;
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path       /tmp/proxy_temp;
      fastcgi_temp_path     /tmp/fastcgi_temp;
      uwsgi_temp_path       /tmp/uwsgi_temp;
      scgi_temp_path        /tmp/scgi_temp;
      # so leitura passa; qualquer outro metodo (POST, PUT, DELETE...) e negado
      map $http_x_original_method $permitido { default 0; GET 1; HEAD 1; }
      # cada decisao vira uma linha de log (quem tentou gravar na auditoria)
      log_format porteiro 'decisao=$status metodo=$http_x_original_method uri=$http_x_original_url origem=$http_x_real_ip ts=$time_iso8601';
      error_log /dev/stderr warn;
      server {
        listen 8080;
        access_log /dev/stdout porteiro;
        location = /healthz { access_log off; return 200 "ok\n"; }
        location = /auth {
          if ($permitido) { return 200; }
          return 403;
        }
        location / { return 404; }
      }
    }
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: auditoria-porteiro, namespace: tipsbank-auditoria, labels: {app: auditoria-porteiro, team: auditoria}}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auditoria-porteiro
  namespace: tipsbank-auditoria
  labels: {app.kubernetes.io/name: auditoria-porteiro, app.kubernetes.io/part-of: tipsbank,
           app: auditoria-porteiro, team: auditoria, env: producao}
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app.kubernetes.io/name: auditoria-porteiro}
  template:
    metadata:
      labels: {app.kubernetes.io/name: auditoria-porteiro, app.kubernetes.io/part-of: tipsbank}
      annotations:
        tipsbank.io/nginx-conf-sha: "v1"     # trocar quando o nginx.conf mudar (forca rollout)
    spec:
      serviceAccountName: auditoria-porteiro
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector: {matchLabels: {app.kubernetes.io/name: auditoria-porteiro}}
                topologyKey: kubernetes.io/hostname
      containers:
        - name: app
          image: ghcr.io/jlui70/tipsbank-web:v1.0.0@sha256:852f48826838c0de6a5dd73880ef13c151464f6f26bdc2ae90f5d9423b966ded
          ports:
            - {name: http, containerPort: 8080}
          volumeMounts:
            - {name: nginx-conf, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf, readOnly: true}
            - {name: tmp, mountPath: /tmp}
          securityContext:
            runAsUser: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          lifecycle:
            preStop:
              sleep: {seconds: 5}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 32Mi}
      volumes:
        - name: nginx-conf
          configMap: {name: auditoria-porteiro-conf}
        - name: tmp
          emptyDir: {sizeLimit: 10Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: auditoria-porteiro
  namespace: tipsbank-auditoria
  labels: {app.kubernetes.io/name: auditoria-porteiro, app.kubernetes.io/part-of: tipsbank}
spec:
  selector: {app.kubernetes.io/name: auditoria-porteiro}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: auditoria-porteiro
  namespace: tipsbank-auditoria
  labels: {app.kubernetes.io/name: auditoria-porteiro, app.kubernetes.io/part-of: tipsbank}
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: auditoria-porteiro}
---
# NetPol: so o ingress-nginx fala com o porteiro; o porteiro nao fala com ninguem
# (o default-deny e o allow-dns-egress do namespace ja existem, 2.5).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: porteiro-ingress
  namespace: tipsbank-auditoria
  labels: {app.kubernetes.io/part-of: tipsbank}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: auditoria-porteiro}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-nginx}}
          podSelector: {matchLabels: {app.kubernetes.io/name: ingress-nginx}}
      ports: [{protocol: TCP, port: 8080}]
