# Etapa 3.7 — HPA do auditoria (manual: min 2, max 6, memória 75%).
# O Deployment NÃO tem mais "replicas:" no manifest: quem decide é o HPA (senão cada kubectl apply
# devolveria o número fixo e brigaria com ele). Métricas: Metrics Server (infra/metrics-server).
#
# behavior (igual nas APIs):
# - scaleUp sem janela de estabilização: reage na hora; até dobrar (100%) ou +4 pods a cada 15 s, o que for maior.
# - scaleDown com janela de 120 s (padrão: 300 s) e no máximo -50% por minuto: depois do pico, volta ao
#   mínimo em poucos minutos (critério: até 10 min) sem "serrilhar" se a carga oscilar.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: auditoria
  namespace: tipsbank-auditoria
  labels: {app.kubernetes.io/name: auditoria, app.kubernetes.io/part-of: tipsbank}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: auditoria}
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: memory
        target: {type: Utilization, averageUtilization: 75}     # 75% do request de memória (128Mi -> 96Mi por pod)
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - {type: Percent, value: 100, periodSeconds: 15}
        - {type: Pods, value: 4, periodSeconds: 15}
    scaleDown:
      stabilizationWindowSeconds: 120
      selectPolicy: Max
      policies:
        - {type: Percent, value: 50, periodSeconds: 60}
