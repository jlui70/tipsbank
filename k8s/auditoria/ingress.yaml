# Etapa 2.1 — rotas da auditoria (mesmo padrão do k8s/contas/ingress.yaml).
# Etapa 2.2 — TLS + teste de Upstream Hashing (passo 7 do manual):
# o controller escolhe o pod pelo hash do cabeçalho X-Cliente. O mesmo valor cai sempre no
# mesmo pod (hash consistente); valores diferentes se espalham pelas 3 réplicas.
# ATENÇÃO: balanceamento é configurado por UPSTREAM (= Service), não por Ingress. Os dois Ingress
# abaixo usam o mesmo Service, então os dois precisam da anotação; com só um, o outro prevalece
# e o hash some. Sem o cabeçalho (chamadas da SPA), o hash é de "" -> sempre o mesmo pod.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: auditoria
  namespace: tipsbank-auditoria
  labels:
    app.kubernetes.io/name: auditoria
    app.kubernetes.io/part-of: tipsbank
  annotations:
    cert-manager.io/cluster-issuer: tipsbank-ca
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/upstream-hash-by: "$http_x_cliente"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [api.tipsbank.local]
      secretName: api-tipsbank-tls
  rules:
    - host: api.tipsbank.local
      http:
        paths:
          - path: /auditoria(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: auditoria
                port:
                  number: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: auditoria-spa
  namespace: tipsbank-auditoria
  labels:
    app.kubernetes.io/name: auditoria
    app.kubernetes.io/part-of: tipsbank
  annotations:
    cert-manager.io/cluster-issuer: tipsbank-ca
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/upstream-hash-by: "$http_x_cliente"   # mesmo upstream do Ingress auditoria
spec:
  ingressClassName: nginx
  tls:
    - hosts: [app.tipsbank.local]
      secretName: app-tipsbank-tls
  rules:
    - host: app.tipsbank.local
      http:
        paths:
          - path: /api/auditoria(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: auditoria
                port:
                  number: 8080
