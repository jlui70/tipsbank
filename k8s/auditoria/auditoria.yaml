# auditoria: grava eventos em /data, num PVC NFS ReadWriteMany compartilhado pelas 3 réplicas (etapa 1.6).
apiVersion: v1
kind: Service
metadata:
  name: auditoria
  namespace: tipsbank-auditoria
  labels: {app.kubernetes.io/name: auditoria, app.kubernetes.io/part-of: tipsbank, tipsbank.io/job: api-auditoria}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: auditoria}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auditoria
  namespace: tipsbank-auditoria
  labels: {app.kubernetes.io/name: auditoria, app.kubernetes.io/part-of: tipsbank, role: app}
spec:
  # replicas: definido pelo HPA (hpa.yaml, etapa 3.7). Não volte a fixar aqui.
  selector:
    matchLabels: {app.kubernetes.io/name: auditoria}
  template:
    metadata:
      labels: {app.kubernetes.io/name: auditoria, app.kubernetes.io/part-of: tipsbank, role: app}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532         # nonroot do Distroless
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      # 3.3: PREFERE espalhar as réplicas por nodes diferentes (preferred: se não houver node
      # livre, o pod sobe mesmo assim no mesmo node — não trava o deploy nem o HPA da 3.7)
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector: {matchLabels: {app.kubernetes.io/name: auditoria}}
                topologyKey: kubernetes.io/hostname
      containers:
        - name: app              # nome fixo: o HPA ContainerResource (Semana 3) referencia "app"
          image: ghcr.io/jlui70/tipsbank-auditoria:v1.0.0@sha256:64768d4d27788fe6e390ffb27e1cca5ae068a79a1779e98eb6702ba1ab2af3b2
          ports:
            - {name: http, containerPort: 8080}
          env:
            - name: DATA_DIR
              valueFrom: {configMapKeyRef: {name: auditoria-config, key: DATA_DIR}}
            - name: LOG_LEVEL
              valueFrom: {configMapKeyRef: {name: auditoria-config, key: LOG_LEVEL}}
          securityContext:
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          lifecycle:
            preStop:
              sleep: {seconds: 5}   # 3.2: segura o SIGTERM até o ingress-nginx/kube-proxy tirarem o pod dos endpoints
          startupProbe:
            httpGet: {path: /health/startup, port: http}
            periodSeconds: 5
            failureThreshold: 30
          # 3.7: timeouts calibrados no stress test. Com timeoutSeconds: 1 (padrão), sob CPU saturada o
          # /health/live (def síncrono, mesmo pool de threads das requisições) passava de 1 s e o kubelet
          # MATAVA pods ocupados, não travados: 28 restarts e conexões cortadas na 1ª rodada do Locust.
          # Readiness tira o pod lento do balanceamento; liveness só reinicia após ~60 s sem resposta.
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests: {cpu: 100m, memory: 128Mi}   # 3.4: valores do manual (uso medido: ~3m / ~70Mi)
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: auditoria-data}
