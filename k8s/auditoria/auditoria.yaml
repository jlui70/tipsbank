# auditoria: grava eventos em /data. emptyDir TEMPORÁRIO (cada réplica tem o seu) -> vira PVC NFS RWX na etapa 1.6.
apiVersion: v1
kind: Service
metadata:
  name: auditoria
  namespace: tipsbank-auditoria
  labels: {app.kubernetes.io/name: auditoria, app.kubernetes.io/part-of: tipsbank}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: auditoria}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auditoria
  namespace: tipsbank-auditoria
  labels: {app.kubernetes.io/name: auditoria, app.kubernetes.io/part-of: tipsbank, role: app}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: auditoria}
  template:
    metadata:
      labels: {app.kubernetes.io/name: auditoria, app.kubernetes.io/part-of: tipsbank, role: app}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532         # nonroot do Distroless
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app              # nome fixo: o HPA ContainerResource (Semana 3) referencia "app"
          image: ghcr.io/jlui70/tipsbank-auditoria:v1.0.0@sha256:64768d4d27788fe6e390ffb27e1cca5ae068a79a1779e98eb6702ba1ab2af3b2
          ports:
            - {name: http, containerPort: 8080}
          env:
            - name: DATA_DIR
              valueFrom: {configMapKeyRef: {name: auditoria-config, key: DATA_DIR}}
            - name: LOG_LEVEL
              valueFrom: {configMapKeyRef: {name: auditoria-config, key: LOG_LEVEL}}
          securityContext:
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          startupProbe:
            httpGet: {path: /health/startup, port: http}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          emptyDir: {}
