# Um namespace por área da empresa (ARQUITETURA §3).
# tipsbank-web = nome do MANUAL-ALUNO 1.4 (a ARQUITETURA não lista o frontend).
# tipsbank.io/netpol=gerenciada-no-git (4.3): as NetworkPolicies deste namespace estão no Git;
# o Kyverno (generate-default-deny-netpol) não gera as dele aqui.
apiVersion: v1
kind: Namespace
metadata:
  name: tipsbank-contas
  labels: {app.kubernetes.io/part-of: tipsbank, tipsbank.io/netpol: gerenciada-no-git, tipsbank.io/area: contas}
---
apiVersion: v1
kind: Namespace
metadata:
  name: tipsbank-transacoes
  labels: {app.kubernetes.io/part-of: tipsbank, tipsbank.io/netpol: gerenciada-no-git, tipsbank.io/area: transacoes}
---
apiVersion: v1
kind: Namespace
metadata:
  name: tipsbank-auditoria
  labels: {app.kubernetes.io/part-of: tipsbank, tipsbank.io/netpol: gerenciada-no-git, tipsbank.io/area: auditoria}
---
apiVersion: v1
kind: Namespace
metadata:
  name: tipsbank-web
  labels: {app.kubernetes.io/part-of: tipsbank, tipsbank.io/netpol: gerenciada-no-git, tipsbank.io/area: web}
---
# Etapa 3.5: kube-prometheus-stack (Prometheus, Alertmanager, Grafana). Instalado por infra/monitoring/install.sh.
apiVersion: v1
kind: Namespace
metadata:
  name: tipsbank-monitoring
  labels: {app.kubernetes.io/part-of: tipsbank, tipsbank.io/netpol: gerenciada-no-git, tipsbank.io/area: monitoring}
---
# Etapa 3.7: gerador de carga (Locust). Fica fora dos namespaces das APIs: o tráfego de teste entra
# pela rede como o de um cliente e é liberado explicitamente nas NetworkPolicies.
apiVersion: v1
kind: Namespace
metadata:
  name: tipsbank-loadtest
  labels: {app.kubernetes.io/part-of: tipsbank, tipsbank.io/netpol: gerenciada-no-git, tipsbank.io/area: loadtest}
