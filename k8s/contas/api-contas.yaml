# api-contas: CRUD de contas + login. Acessa o Postgres no mesmo namespace.
apiVersion: v1
kind: Service
metadata:
  name: api-contas
  namespace: tipsbank-contas
  labels: {app.kubernetes.io/name: api-contas, app.kubernetes.io/part-of: tipsbank, tipsbank.io/job: api-contas}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: api-contas}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-contas
  namespace: tipsbank-contas
  labels: {app.kubernetes.io/name: api-contas, app.kubernetes.io/part-of: tipsbank, role: app,
           app: api-contas, team: contas, env: producao}
spec:
  # replicas: definido pelo HPA (hpa.yaml, etapa 3.7). Não volte a fixar aqui.
  selector:
    matchLabels: {app.kubernetes.io/name: api-contas}
  template:
    metadata:
      labels: {app.kubernetes.io/name: api-contas, app.kubernetes.io/part-of: tipsbank, role: app}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532         # nonroot do Distroless
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      # 3.3: PREFERE espalhar as réplicas por nodes diferentes (preferred: se não houver node
      # livre, o pod sobe mesmo assim no mesmo node — não trava o deploy nem o HPA da 3.7)
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector: {matchLabels: {app.kubernetes.io/name: api-contas}}
                topologyKey: kubernetes.io/hostname
      containers:
        - name: app              # nome fixo: o HPA ContainerResource (Semana 3) referencia "app"
          image: ghcr.io/jlui70/tipsbank-api-contas:v1.2.0@sha256:f99c96cedcf83921d77b89419fee5936c6fca6a383897b4361cdc6ac9d01146c
          ports:
            - {name: http, containerPort: 8080}
          env:
            - name: DB_URL
              valueFrom: {secretKeyRef: {name: contas-db, key: DB_URL}}
            - name: LOG_LEVEL
              valueFrom: {configMapKeyRef: {name: contas-config, key: LOG_LEVEL}}
            - name: DB_POOL_SIZE
              valueFrom: {configMapKeyRef: {name: contas-config, key: DB_POOL_SIZE}}
            - name: DB_MAX_OVERFLOW
              valueFrom: {configMapKeyRef: {name: contas-config, key: DB_MAX_OVERFLOW}}
          securityContext:
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          lifecycle:
            preStop:
              sleep: {seconds: 5}   # 3.2: segura o SIGTERM até o ingress-nginx/kube-proxy tirarem o pod dos endpoints
          startupProbe:
            httpGet: {path: /health/startup, port: http}
            periodSeconds: 5
            failureThreshold: 30
          # 3.7: timeouts calibrados no stress test. Com timeoutSeconds: 1 (padrão), sob CPU saturada o
          # /health/live (def síncrono, mesmo pool de threads das requisições) passava de 1 s e o kubelet
          # MATAVA pods ocupados, não travados: 28 restarts e conexões cortadas na 1ª rodada do Locust.
          # Readiness tira o pod lento do balanceamento; liveness só reinicia após ~60 s sem resposta.
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests: {cpu: 100m, memory: 128Mi}   # 3.4: valores do manual (uso medido: ~3m / ~70Mi)
            limits: {cpu: 500m, memory: 256Mi}


