# api-contas: CRUD de contas + login. Acessa o Postgres no mesmo namespace.
apiVersion: v1
kind: Service
metadata:
  name: api-contas
  namespace: tipsbank-contas
  labels: {app.kubernetes.io/name: api-contas, app.kubernetes.io/part-of: tipsbank}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: api-contas}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-contas
  namespace: tipsbank-contas
  labels: {app.kubernetes.io/name: api-contas, app.kubernetes.io/part-of: tipsbank, role: app}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: api-contas}
  template:
    metadata:
      labels: {app.kubernetes.io/name: api-contas, app.kubernetes.io/part-of: tipsbank, role: app}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532         # nonroot do Distroless
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app              # nome fixo: o HPA ContainerResource (Semana 3) referencia "app"
          image: ghcr.io/jlui70/tipsbank-api-contas:v1.0.0@sha256:c919b4d3096a906937522d512143c0020100c1ac31ac88e79849aac777f42e41
          ports:
            - {name: http, containerPort: 8080}
          env:
            - name: DB_URL
              valueFrom: {secretKeyRef: {name: contas-db, key: DB_URL}}
            - name: LOG_LEVEL
              valueFrom: {configMapKeyRef: {name: contas-config, key: LOG_LEVEL}}
          securityContext:
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          startupProbe:
            httpGet: {path: /health/startup, port: http}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}


