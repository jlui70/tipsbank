# Gerado com: kubectl create configmap postgres-init -n tipsbank-contas --from-file=00-replicacao.sh=../../sql/00-replicacao.sh --from-file=init.sql=../../sql/init.sql --dry-run=client -o yaml
apiVersion: v1
data:
  00-replicacao.sh: |
    #!/bin/sh
    # Etapa 3.3 — prepara o primary para a réplica streaming (postgres-replica).
    # Roda UMA vez, no primeiro boot (initdb), antes do init.sql: o entrypoint da imagem
    # oficial executa os arquivos de /docker-entrypoint-initdb.d em ordem alfabética.
    # REPLICATION_PASSWORD vem do Secret postgres-credentials.
    set -eu
    : "${REPLICATION_PASSWORD:?REPLICATION_PASSWORD não definido}"

    psql -v ON_ERROR_STOP=1 -v senha="$REPLICATION_PASSWORD" \
         --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<'EOSQL'
    -- usuário só de replicação: não é superusuário e não lê as tabelas da app
    CREATE ROLE replicator WITH REPLICATION LOGIN PASSWORD :'senha';
    -- slot físico: o primary guarda o WAL até a réplica confirmar que recebeu
    SELECT pg_create_physical_replication_slot('postgres_replica_0');
    EOSQL

    # conexões de replicação (banco especial "replication") só do usuário replicator, com senha.
    # Quem pode chegar na porta 5432 é decidido pela NetworkPolicy (2.5).
    echo "host replication replicator all scram-sha-256" >> "$PGDATA/pg_hba.conf"
  init.sql: |
    -- TipsBank - schema inicial
    -- Executado automaticamente pelo Postgres no primeiro boot
    -- (o SQLAlchemy tambem cria as tabelas se nao existirem, mas deixamos aqui
    -- para ser a "fonte da verdade" e gerar dados seed)

    CREATE TABLE IF NOT EXISTS contas (
        id VARCHAR(64) PRIMARY KEY,
        titular VARCHAR(120) NOT NULL,
        documento VARCHAR(14) NOT NULL UNIQUE,
        senha_hash VARCHAR(255) NOT NULL DEFAULT '',
        saldo NUMERIC(15, 2) NOT NULL DEFAULT 0,
        criada_em TIMESTAMP DEFAULT NOW()
    );

    CREATE INDEX IF NOT EXISTS idx_contas_documento ON contas(documento);

    CREATE TABLE IF NOT EXISTS transacoes (
        id VARCHAR(64) PRIMARY KEY,
        origem_id VARCHAR(64) NOT NULL,
        destino_id VARCHAR(64) NOT NULL,
        valor NUMERIC(15, 2) NOT NULL,
        status VARCHAR(20) NOT NULL,
        criada_em TIMESTAMP DEFAULT NOW()
    );

    CREATE INDEX IF NOT EXISTS idx_transacoes_origem ON transacoes(origem_id);
    CREATE INDEX IF NOT EXISTS idx_transacoes_destino ON transacoes(destino_id);

    -- Dados seed (2 contas de exemplo, senha padrao: "giropops")
    -- O hash bcrypt abaixo foi gerado com bcrypt.hashpw("giropops", gensalt(10))
    INSERT INTO contas (id, titular, documento, senha_hash, saldo) VALUES
        ('11111111-1111-1111-1111-111111111111', 'Jeferson Fernando', '12345678901',
         '$2b$10$5SvZ8xkTk5HEldopD9Vig.UAu2icE2IxskWxaPtl1PjQ0o3xNfDme', 10000.00),
        ('22222222-2222-2222-2222-222222222222', 'LinuxTips SA',      '98765432100',
         '$2b$10$5SvZ8xkTk5HEldopD9Vig.UAu2icE2IxskWxaPtl1PjQ0o3xNfDme',   500.00)
    ON CONFLICT (documento) DO NOTHING;
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: tipsbank-contas
