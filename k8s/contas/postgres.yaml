# Postgres primary: Headless Service + StatefulSet (Day-7) com PVC de 2Gi na StorageClass default (Day-6).
# Etapa 3.3: roda no node dedicado tipsbank-w3 (taint compliance=strict:NoSchedule + label compliance=strict)
# e é a origem da réplica streaming (postgres-replica.yaml).
apiVersion: v1
kind: Service
metadata:
  name: postgres-primary
  namespace: tipsbank-contas
  labels: {app.kubernetes.io/name: postgres-primary, app.kubernetes.io/part-of: tipsbank}
spec:
  clusterIP: None            # headless: o DNS devolve o IP do pod (postgres-primary-0.postgres-primary...)
  selector: {app.kubernetes.io/name: postgres-primary}
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-primary
  namespace: tipsbank-contas
  labels: {app.kubernetes.io/name: postgres-primary, app.kubernetes.io/part-of: tipsbank, role: db,
           app: postgres-primary, team: contas, env: producao}
spec:
  serviceName: postgres-primary
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: postgres-primary}
  template:
    metadata:
      labels: {app.kubernetes.io/name: postgres-primary, app.kubernetes.io/part-of: tipsbank, role: db}
    spec:
      serviceAccountName: postgres                # etapa 4.4: SA propria, sem token (a app nao usa a API do Kubernetes)
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70          # usuário postgres da imagem alpine
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: {type: RuntimeDefault}
      # 3.3: a toleration PERMITE entrar no node com taint; a nodeAffinity OBRIGA a ir para ele
      tolerations:
        - {key: compliance, operator: Equal, value: strict, effect: NoSchedule}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: compliance, operator: In, values: [strict]}
      containers:
        - name: postgres
          image: ghcr.io/jlui70/mirror/postgres:16-alpine@sha256:ac838714b7d794185a866e5a6b479b954e7d8a070568aa0acac6fe07c3070bf5
          # 3.7: 150 conexões (padrão: 100). O HPA multiplica os pools das APIs; a conta está nos
          # configmap-app.yaml. Na réplica (hot standby) o valor precisa ser >= ao do primary.
          args: ["-c", "max_connections=150"]
          ports:
            - {name: postgres, containerPort: 5432}
          env:
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: postgres-credentials, key: POSTGRES_USER}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-credentials, key: POSTGRES_PASSWORD}}
            - name: POSTGRES_DB
              valueFrom: {secretKeyRef: {name: postgres-credentials, key: POSTGRES_DB}}
            - name: REPLICATION_PASSWORD         # usado só pelo 00-replicacao.sh no primeiro boot
              valueFrom: {secretKeyRef: {name: postgres-credentials, key: REPLICATION_PASSWORD}}
            # 4.4: usuarios de aplicacao, usados so pelo roles-app.sh no primeiro boot (initdb)
            - name: CONTAS_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-credentials, key: CONTAS_DB_PASSWORD}}
            - name: TRANSACOES_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-credentials, key: TRANSACOES_DB_PASSWORD}}
            - name: PGDATA                       # subdiretório: o initdb exige diretório vazio
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
            - {name: run, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
          securityContext:
            runAsUser: 70
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            exec: {command: [sh, -c, 'pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"']}
            periodSeconds: 5
          livenessProbe:
            exec: {command: [sh, -c, 'pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"']}
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests: {cpu: 250m, memory: 512Mi}   # 3.4: valores do manual
            limits: {cpu: "1", memory: 1Gi}
      volumes:
        - name: init
          configMap: {name: postgres-init, defaultMode: 0555}   # .sh executável: o entrypoint executa (sem isso faz "source")
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 2Gi}
        # sem storageClassName = usa a StorageClass default (local-path no kubeadm, gp3 no EKS)
