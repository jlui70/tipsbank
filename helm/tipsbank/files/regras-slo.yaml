groups:
- name: tipsbank-slo
  interval: 30s
  rules:
  - alert: TipsBankApiDown
    expr: up{job=~"api-.*"} == 0
    for: 2m
    labels:
      severity: critical
      team: tipsbank
    annotations:
      summary: '{{ $labels.job }} fora do ar ({{ $labels.pod }})'
      description: O Prometheus não consegue coletar /metrics de {{ $labels.pod }} ({{ $labels.namespace }}) há mais de 2 minutos.
  - alert: TipsBankP99Alto
    expr: "histogram_quantile(0.99,\n  sum by (job, le) (\n    rate(http_request_duration_seconds_bucket{job=~\"api-.*\", path!~\"/metrics|/health/.*\"}[5m])\n  )\n) > 0.5\n"
    for: 5m
    labels:
      severity: warning
      team: tipsbank
    annotations:
      summary: p99 de {{ $labels.job }} acima de 500 ms
      description: 'p99 de {{ $labels.job }} = {{ $value | humanizeDuration }} (SLO: 500 ms) há mais de 5 minutos.'
  - alert: TipsBankErroAltoApi
    expr: "sum by (job) (rate(http_requests_total{job=~\"api-.*\", status=~\"5..\", path!~\"/metrics|/health/.*\"}[5m]))\n  /\nsum by (job) (rate(http_requests_total{job=~\"api-.*\", path!~\"/metrics|/health/.*\"\
      }[5m]))\n  > 0.05\n"
    for: 3m
    labels:
      severity: critical
      team: tipsbank
    annotations:
      summary: '{{ $labels.job }} com {{ $value | humanizePercentage }} de respostas 5xx'
      description: Taxa de 5xx de {{ $labels.job }} acima de 5% há mais de 3 minutos.
  - alert: TipsBankPodCrashLoop
    expr: increase(kube_pod_container_status_restarts_total{namespace=~"tipsbank-.*"}[10m]) > 3
    labels:
      severity: warning
      team: tipsbank
    annotations:
      summary: '{{ $labels.namespace }}/{{ $labels.pod }} reiniciando sem parar'
      description: O container {{ $labels.container }} de {{ $labels.pod }} reiniciou {{ $value | printf "%.0f" }} vezes nos últimos 10 minutos.
