# nginx config pro frontend TipsBank no Kubernetes.
# - Serve os arquivos estaticos em /
# - /api/* nao chega aqui: o Ingress roteia direto para as APIs

worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;

  # nginx-unprivileged (user 101) precisa dessas paths gravaveis
  client_body_temp_path /tmp/client_body;
  proxy_temp_path       /tmp/proxy;
  fastcgi_temp_path     /tmp/fastcgi;
  uwsgi_temp_path       /tmp/uwsgi;
  scgi_temp_path        /tmp/scgi;

  server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # health check propria do frontend
    location = /healthz {
      access_log off;
      return 200 "ok\n";
    }

    # SPA fallback — qualquer rota que nao achar, volta pro index.html
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
