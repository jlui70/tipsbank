worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 256; }
http {
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;
  # so leitura passa; qualquer outro metodo (POST, PUT, DELETE...) e negado
  map $http_x_original_method $permitido { default 0; GET 1; HEAD 1; }
  # cada decisao vira uma linha de log (quem tentou gravar na auditoria)
  log_format porteiro 'decisao=$status metodo=$http_x_original_method uri=$http_x_original_url origem=$http_x_real_ip ts=$time_iso8601';
  error_log /dev/stderr warn;
  server {
    listen 8080;
    access_log /dev/stdout porteiro;
    location = /healthz { access_log off; return 200 "ok\n"; }
    location = /auth {
      if ($permitido) { return 200; }
      return 403;
    }
    location / { return 404; }
  }
}
