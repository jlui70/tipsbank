{{- /* Credenciais do Postgres (1.4, 3.3, 4.4). Geradas na 1a instalacao e reaproveitadas nos
       upgrades (helper tipsbank.senha): nenhuma senha no values.yaml nem no Git. */ -}}
{{- $ns := .Values.namespaces.contas -}}
{{- $s := .Values.postgres.senhas -}}
{{- $admin := include "tipsbank.senha" (dict "root" $ "ns" $ns "secret" "postgres-credentials" "chave" "POSTGRES_PASSWORD" "fixa" $s.admin) -}}
{{- $repl := include "tipsbank.senha" (dict "root" $ "ns" $ns "secret" "postgres-credentials" "chave" "REPLICATION_PASSWORD" "fixa" $s.replicacao) -}}
{{- $contas := include "tipsbank.senha" (dict "root" $ "ns" $ns "secret" "postgres-credentials" "chave" "CONTAS_DB_PASSWORD" "fixa" $s.contas) -}}
{{- $trans := include "tipsbank.senha" (dict "root" $ "ns" $ns "secret" "postgres-credentials" "chave" "TRANSACOES_DB_PASSWORD" "fixa" $s.transacoes) -}}
{{- $host := printf "postgres-primary.%s.svc.cluster.local:5432/%s" $ns .Values.postgres.banco -}}
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: {{ $ns }}
  labels:
    {{- include "tipsbank.labels" (dict "root" $ "componente" "postgres") | nindent 4 }}
type: Opaque
stringData:
  # superusuario: so DBA, so via kubectl exec (pg_hba rejeita pela rede)
  POSTGRES_USER: {{ .Values.postgres.usuarioAdmin | quote }}
  POSTGRES_PASSWORD: {{ $admin | quote }}
  POSTGRES_DB: {{ .Values.postgres.banco | quote }}
  REPLICATION_PASSWORD: {{ $repl | quote }}
  CONTAS_DB_PASSWORD: {{ $contas | quote }}
  TRANSACOES_DB_PASSWORD: {{ $trans | quote }}
---
# DB_URL da api-contas: usuario app_contas (so contas/movimentos)
apiVersion: v1
kind: Secret
metadata:
  name: contas-db
  namespace: {{ $ns }}
  labels:
    {{- include "tipsbank.labels" (dict "root" $ "componente" "api-contas") | nindent 4 }}
type: Opaque
stringData:
  DB_URL: {{ printf "postgresql+psycopg://app_contas:%s@%s" $contas $host | quote }}
---
# DB_URL da api-transacoes (Secret no namespace dela): usuario app_transacoes (so transacoes)
apiVersion: v1
kind: Secret
metadata:
  name: transacoes-db
  namespace: {{ .Values.namespaces.transacoes }}
  labels:
    {{- include "tipsbank.labels" (dict "root" $ "componente" "api-transacoes") | nindent 4 }}
type: Opaque
stringData:
  DB_URL: {{ printf "postgresql+psycopg://app_transacoes:%s@%s" $trans $host | quote }}
