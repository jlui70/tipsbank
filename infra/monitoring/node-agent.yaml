# Etapa 3.8 — DaemonSet "node-agent": 1 pod por WORKER, registrando a cada 30 s o node, o disco, a carga e a
# memória em uma linha JSON no stdout (kubectl logs). O node-exporter (3.5) já cobre as métricas em
# Prometheus; este agente é o exemplo didático do manual ("busybox imprimindo hostname e uso de disco").
#
# Decisões:
# - Tolera SÓ o taint compliance=strict (tipsbank-w3, Postgres, 3.3): sem a toleration o DaemonSet ficaria
#   com 2 pods. NÃO tolera o taint do control-plane: o critério é "um por worker" (o node-exporter roda nos 4
#   porque tolera qualquer NoSchedule).
# - Disco do NODE: hostPath "/" montado SOMENTE LEITURA em /host (o mesmo que o node-exporter faz com o
#   rootfs). /proc/loadavg e /proc/meminfo já são do kernel do node (não do cgroup do container).
# - Sem rede, sem token de ServiceAccount, sem root, root filesystem read-only, capabilities zeradas.
# - O nome do node vem da Downward API (spec.nodeName): o hostname do container seria o nome do pod.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-agent
  namespace: tipsbank-monitoring
  labels: {app.kubernetes.io/name: node-agent, app.kubernetes.io/part-of: tipsbank}
spec:
  revisionHistoryLimit: 3
  selector:
    matchLabels: {app.kubernetes.io/name: node-agent}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 1}        # troca 1 node por vez
  template:
    metadata:
      labels: {app.kubernetes.io/name: node-agent, app.kubernetes.io/part-of: tipsbank}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 5
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534                      # nobody
        runAsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      tolerations:
        - {key: compliance, operator: Equal, value: strict, effect: NoSchedule}
      containers:
        - name: agent
          image: busybox:1.37@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command:
            - sh
            - -c
            - |
              while true; do
                disco=$(df -P /host | awk 'NR==2 {print $5}')
                livre=$(df -Ph /host | awk 'NR==2 {print $4}')
                carga=$(cut -d' ' -f1-3 /proc/loadavg)
                mem_total=$(awk '/^MemTotal/ {print $2}' /proc/meminfo)
                mem_disp=$(awk '/^MemAvailable/ {print $2}' /proc/meminfo)
                mem_uso=$(( (mem_total - mem_disp) * 100 / mem_total ))
                echo "{\"ts\":\"$(date -u +%FT%TZ)\",\"node\":\"$NODE_NAME\",\"disco_uso\":\"$disco\",\"disco_livre\":\"$livre\",\"load\":\"$carga\",\"mem_uso\":\"${mem_uso}%\"}"
                touch /tmp/heartbeat
                sleep 30
              done
          env:
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
          # o laço "travou" se o heartbeat tem mais de 2 min (4 ciclos perdidos)
          livenessProbe:
            exec: {command: [sh, -c, 'test -n "$(find /tmp/heartbeat -mmin -2)"']}
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {cpu: 50m, memory: 32Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: host-root, mountPath: /host, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: host-root
          hostPath: {path: /, type: Directory}
        - name: tmp
          emptyDir: {sizeLimit: 1Mi}
