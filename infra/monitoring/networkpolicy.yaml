# Etapa 4.3 — NetworkPolicy zero-trust do namespace tipsbank-monitoring (sem NetPol desde a 3.5).
#
# Quem fala com quem (levantado dos alvos ativos do Prometheus em 2026-11-07):
#   ingress-nginx  -> prometheus:9090, alertmanager:9093, grafana:3000   (UIs com Basic Auth/login)
#   grafana        -> prometheus:9090, alertmanager:9093                 (datasources)
#   prometheus     -> alertmanager:9093 (envio de alertas) e scrape de:
#                     alertmanager 9093/8080, grafana 3000, operator 10250, kube-state-metrics 8080,
#                     ele mesmo 9090/8080, coredns 9153 (kube-system), APIs 8080 (tipsbank-contas,
#                     -transacoes, -auditoria) e, na rede dos nodes (192.168.122.0/24):
#                     apiserver 6443, kubelet 10250, node-exporter 9100 (hostNetwork)
#   API server     -> operator:10250 (webhook kps-admission de PrometheusRule)
#   operator, kube-state-metrics, grafana (sidecars de dashboards) -> API server 6443
#   node-agent     -> nada (so le o /host do node)
# node-exporter usa hostNetwork: NetworkPolicy nao se aplica a ele.
# Sem egress para a internet (alertmanager com receiver null; grafana sem download de plugin).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny, namespace: tipsbank-monitoring, labels: {team: plataforma}}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-dns-egress, namespace: tipsbank-monitoring, labels: {team: plataforma}}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
---
# --- Prometheus ---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: prometheus-ingress, namespace: tipsbank-monitoring, labels: {team: plataforma}}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: prometheus}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-nginx}}
          podSelector: {matchLabels: {app.kubernetes.io/name: ingress-nginx}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: grafana}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: prometheus}}
        # `kubectl get --raw .../services/kps-prometheus:9090/proxy/...` (consultas
        # de operacao desde a 3.5): quem conecta e o API server, que ja exigiu RBAC.
        - ipBlock: {cidr: 192.168.122.10/32}
        - ipBlock: {cidr: 10.244.194.64/32}
      ports: [{protocol: TCP, port: 9090}]
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: prometheus}}
      ports: [{protocol: TCP, port: 8080}]          # config-reloader (auto-scrape)
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: prometheus-egress, namespace: tipsbank-monitoring, labels: {team: plataforma}}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: prometheus}}
  policyTypes: [Egress]
  egress:
    - to:                                              # dentro do namespace
        - podSelector: {matchLabels: {app.kubernetes.io/name: alertmanager}}
      ports: [{protocol: TCP, port: 9093}, {protocol: TCP, port: 8080}]
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: grafana}}
      ports: [{protocol: TCP, port: 3000}]
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: kube-prometheus-stack-prometheus-operator}}
      ports: [{protocol: TCP, port: 10250}]
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: kube-state-metrics}}
      ports: [{protocol: TCP, port: 8080}]
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: prometheus}}
      ports: [{protocol: TCP, port: 9090}, {protocol: TCP, port: 8080}]
    - to:                                              # coredns
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{protocol: TCP, port: 9153}]
    - to:                                              # /metrics das APIs (ServiceMonitors da 3.5)
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: tipsbank-contas}}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: tipsbank-transacoes}}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: tipsbank-auditoria}}
      ports: [{protocol: TCP, port: 8080}]
    - to:                                              # rede dos nodes: apiserver, kubelet, node-exporter
        - ipBlock: {cidr: 192.168.122.0/24}
      ports: [{protocol: TCP, port: 6443}, {protocol: TCP, port: 10250}, {protocol: TCP, port: 9100}]
---
# --- Alertmanager ---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: alertmanager-ingress, namespace: tipsbank-monitoring, labels: {team: plataforma}}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: alertmanager}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-nginx}}
          podSelector: {matchLabels: {app.kubernetes.io/name: ingress-nginx}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: grafana}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: prometheus}}
      ports: [{protocol: TCP, port: 9093}]
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: prometheus}}
      ports: [{protocol: TCP, port: 8080}]
---
# --- Grafana ---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: grafana-ingress, namespace: tipsbank-monitoring, labels: {team: plataforma}}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: grafana}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-nginx}}
          podSelector: {matchLabels: {app.kubernetes.io/name: ingress-nginx}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: prometheus}}
      ports: [{protocol: TCP, port: 3000}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: grafana-egress, namespace: tipsbank-monitoring, labels: {team: plataforma}}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: grafana}}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: prometheus}}
      ports: [{protocol: TCP, port: 9090}]
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: alertmanager}}
      ports: [{protocol: TCP, port: 9093}]
---
# --- Operator (webhook) e kube-state-metrics ---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: operator-ingress, namespace: tipsbank-monitoring, labels: {team: plataforma}}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: kube-prometheus-stack-prometheus-operator}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: prometheus}}
        - ipBlock: {cidr: 192.168.122.10/32}       # API server (webhook kps-admission)
        - ipBlock: {cidr: 10.244.194.64/32}        # idem, pelo tunel IPIP do cp
      ports: [{protocol: TCP, port: 10250}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: ksm-ingress, namespace: tipsbank-monitoring, labels: {team: plataforma}}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: kube-state-metrics}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: prometheus}}
      ports: [{protocol: TCP, port: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-apiserver-egress, namespace: tipsbank-monitoring, labels: {team: plataforma}}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [kube-prometheus-stack-prometheus-operator, kube-state-metrics, grafana]
  policyTypes: [Egress]
  egress:
    - to: [{ipBlock: {cidr: 192.168.122.10/32}}]
      ports: [{protocol: TCP, port: 6443}]
