# kube-prometheus-stack 92.21.2 (app v0.94.2) — values do lab kubeadm (etapa 3.5).
# Instalação: infra/monitoring/install.sh (helm upgrade --install no namespace tipsbank-monitoring).
#
# Decisões:
# - SEM Jobs (proibidos no desafio): o chart cria 2 Jobs (admission-create/patch) para gerar o
#   certificado do webhook do operator. Aqui o cert-manager (2.2) emite o certificado e o cainjector
#   injeta o CA nos webhooks.
# - ServiceMonitor/PodMonitor/PrometheusRule de QUALQUER namespace, sem exigir o label "release":
#   os ServiceMonitors das APIs ficam junto delas (k8s/<ns>/servicemonitor.yaml), e os alertas da 3.6 também.
# - etcd, scheduler, controller-manager e kube-proxy desligados: no kubeadm escutam só em 127.0.0.1,
#   e os alvos ficariam DOWN para sempre (e disparariam alertas falsos na 3.6).
# - resources em TODOS os containers (3.4 e compliance #4); valores para um lab de 2 workers de 4 GiB.
# - UIs via Ingress com TLS da CA do lab (tipsbank-ca, 2.2); Prometheus e Alertmanager não têm login
#   próprio -> Basic Auth no Ingress (Secret gerado por infra/monitoring/gerar-secrets.sh, fora do Git).

fullnameOverride: kps

# Dono do workload (require-labels, etapa 4.1). Vale para operator e CRs
# Prometheus/Alertmanager (o operator copia para os StatefulSets). Subcharts abaixo.
commonLabels: {team: plataforma, env: producao}

crds:
  enabled: true

# --- alvos que não existem no kubeadm (bind em 127.0.0.1) ---
kubeEtcd: {enabled: false}
kubeScheduler: {enabled: false}
kubeControllerManager: {enabled: false}
kubeProxy: {enabled: false}
defaultRules:
  rules:
    etcd: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeControllerManager: false
    kubeProxy: false

# --- operator: webhook com certificado do cert-manager, sem Jobs ---
prometheusOperator:
  admissionWebhooks:
    # Sem o Job "patch", os webhooks já nascem registrados antes de o operator subir: com Fail, o
    # próprio helm install é recusado (os PrometheusRule do chart passam pelo webhook). Ignore = se o
    # operator estiver fora, o objeto entra sem validação (o operator valida de novo ao reconciliar).
    failurePolicy: Ignore
    patch:
      enabled: false
    certManager:
      enabled: true
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 300m, memory: 256Mi}
  # 4.6 (compliance #2): o uid ja vem do pod (65534); aqui ele fica DECLARADO no container, que e
  # o que o auditor confere (container sem runAsUser = "pode ser root", depende da imagem).
  containerSecurityContext: {runAsUser: 65534, runAsGroup: 65534, runAsNonRoot: true}
  prometheusConfigReloader:
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {cpu: 100m, memory: 64Mi}

# --- Prometheus ---
prometheus:
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: tipsbank-ca
      nginx.ingress.kubernetes.io/auth-type: basic
      nginx.ingress.kubernetes.io/auth-secret: monitoring-basic-auth
      nginx.ingress.kubernetes.io/auth-realm: "TipsBank - monitoramento"
    hosts: [prometheus.tipsbank.local]
    paths: [/]
    pathType: Prefix
    tls:
      - {secretName: prometheus-tipsbank-tls, hosts: [prometheus.tipsbank.local]}
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeInterval: 15s
    retention: 3d
    retentionSize: 3GB
    # 4.6: o operator faz strategic merge destes containers com os que ele gera (casa pelo nome).
    #  - runAsUser declarado em todos (compliance #2; o pod ja roda como 1000).
    #  - livenessProbe no config-reloader (compliance #3): /healthz da porta reloader-web.
    containers:
      - name: prometheus
        securityContext: {runAsUser: 1000, runAsGroup: 2000, runAsNonRoot: true}
      - name: config-reloader
        securityContext: {runAsUser: 1000, runAsGroup: 2000, runAsNonRoot: true}
        livenessProbe:
          httpGet: {path: /healthz, port: reloader-web}
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
    initContainers:
      - name: init-config-reloader
        securityContext: {runAsUser: 1000, runAsGroup: 2000, runAsNonRoot: true}
    resources:
      requests: {cpu: 200m, memory: 512Mi}
      limits: {cpu: "1", memory: 1536Mi}
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests: {storage: 5Gi}

# --- Alertmanager ---
alertmanager:
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: tipsbank-ca
      nginx.ingress.kubernetes.io/auth-type: basic
      nginx.ingress.kubernetes.io/auth-secret: monitoring-basic-auth
      nginx.ingress.kubernetes.io/auth-realm: "TipsBank - monitoramento"
    hosts: [alertmanager.tipsbank.local]
    paths: [/]
    pathType: Prefix
    tls:
      - {secretName: alertmanager-tipsbank-tls, hosts: [alertmanager.tipsbank.local]}
  alertmanagerSpec:
    # 4.6: o operator faz strategic merge destes containers com os que ele gera (casa pelo nome).
    #  - runAsUser declarado em todos (compliance #2; o pod ja roda como 1000).
    #  - livenessProbe no config-reloader (compliance #3): /healthz da porta reloader-web.
    containers:
      - name: alertmanager
        securityContext: {runAsUser: 1000, runAsGroup: 2000, runAsNonRoot: true}
      - name: config-reloader
        securityContext: {runAsUser: 1000, runAsGroup: 2000, runAsNonRoot: true}
        livenessProbe:
          httpGet: {path: /healthz, port: reloader-web}
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
    initContainers:
      - name: init-config-reloader
        securityContext: {runAsUser: 1000, runAsGroup: 2000, runAsNonRoot: true}
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {cpu: 100m, memory: 128Mi}

# --- Grafana ---
grafana:
  extraLabels: {app: grafana, team: plataforma, env: producao}
  testFramework:
    enabled: false          # o teste do chart é um Pod solto (helm test); não é usado
  admin:
    existingSecret: grafana-admin      # gerado por infra/monitoring/gerar-secrets.sh (senha fora do Git)
    userKey: admin-user
    passwordKey: admin-password
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: tipsbank-ca
    hosts: [grafana.tipsbank.local]
    path: /
    tls:
      - {secretName: grafana-tipsbank-tls, hosts: [grafana.tipsbank.local]}
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 384Mi}
  containerSecurityContext: {runAsUser: 472, runAsGroup: 472, runAsNonRoot: true}   # 4.6 (#2)
  sidecar:
    resources:
      requests: {cpu: 10m, memory: 64Mi}
      limits: {cpu: 100m, memory: 128Mi}
    securityContext: {runAsUser: 472, runAsGroup: 472, runAsNonRoot: true}          # 4.6 (#2)
    # 4.6 (#3) e BUG corrigido: os 2 sidecars (dashboards e datasources) sobem um health server na
    # MESMA porta (8080, padrao do k8s-sidecar) dentro do mesmo pod; o 2o falhava com "address
    # already in use" e ficava sem /healthz. Agora cada um tem a sua porta (HEALTH_PORT abaixo).
    # A livenessProbe do chart e UMA so para os 2 sidecars (nao da para apontar portas diferentes):
    # ela e aplicada por container no install.sh (kubectl patch, httpGet /healthz em cada porta).
    # Tentativa descartada: probe exec com python lendo HEALTH_PORT -> o interpretador leva > 5 s
    # para subir com limit de 100m de CPU, a probe estoura o timeout e o kubelet mata o sidecar.
    dashboards:
      searchNamespace: ALL      # ConfigMaps com label grafana_dashboard=1 em qualquer namespace
      env: {HEALTH_PORT: "8080"}
    datasources:
      env: {HEALTH_PORT: "8081"}

kube-state-metrics:
  customLabels: {app: kube-state-metrics, team: plataforma, env: producao}
  containerSecurityContext: {runAsUser: 65534, runAsGroup: 65534, runAsNonRoot: true}   # 4.6 (#2)
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {cpu: 100m, memory: 128Mi}

prometheus-node-exporter:
  commonLabels: {app: node-exporter, team: plataforma, env: producao}
  containerSecurityContext: {runAsUser: 65534, runAsGroup: 65534, runAsNonRoot: true}   # 4.6 (#2)
  resources:
    requests: {cpu: 10m, memory: 24Mi}
    limits: {cpu: 200m, memory: 64Mi}
