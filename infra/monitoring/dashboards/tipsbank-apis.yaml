# Etapa 3.5: dashboard do Grafana como código. O sidecar do Grafana carrega todo ConfigMap
# com o label grafana_dashboard="1" (sidecar.dashboards.searchNamespace: ALL no values).
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-tipsbank-apis
  namespace: tipsbank-monitoring
  labels: {grafana_dashboard: "1", app.kubernetes.io/part-of: tipsbank}
data:
  tipsbank-apis.json: |
    {
      "uid": "tipsbank-apis",
      "title": "TipsBank — APIs",
      "tags": [
        "tipsbank"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "APIs no ar (targets UP)",
          "description": "Alvos dos ServiceMonitors com up=1 (contas 2 + transacoes 3 + auditoria 3)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(up{job=~\"api-.*\"})"
            }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Requests/s (sem health)",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 6,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(rate(http_requests_total{job=~\"api-.*\", path!~\"/health.*|/metrics\"}[2m]))"
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "% de 5xx (5 min)",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "100 * (sum(rate(http_requests_total{job=~\"api-.*\", path!~\"/health.*|/metrics\", status=~\"5..\"}[5m])) or vector(0)) / clamp_min(sum(rate(http_requests_total{job=~\"api-.*\", path!~\"/health.*|/metrics\"}[5m])), 1e-9)"
            }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "p99 (5 min)",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 18,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.99, sum by (le) (rate(http_request_duration_seconds_bucket{job=~\"api-.*\", path!~\"/health.*|/metrics\"}[5m])))"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Requests/s por endpoint",
          "description": "Sem /health/* e /metrics (probes e scrape). Métrica da app: http_requests_total (contas e transacoes).",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 4,
            "w": 12,
            "h": 9
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (job, method, path) (rate(http_requests_total{job=~\"api-.*\", path!~\"/health.*|/metrics\"}[2m]))",
              "legendFormat": "{{job}} {{method}} {{path}}"
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Latência p50 / p95 / p99 por API",
          "description": "histogram_quantile sobre http_request_duration_seconds_bucket (buckets padrão do prometheus_client).",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 4,
            "w": 12,
            "h": 9
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.5, sum by (le, job) (rate(http_request_duration_seconds_bucket{job=~\"api-.*\", path!~\"/health.*|/metrics\"}[5m])))",
              "legendFormat": "{{job}} p50"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.95, sum by (le, job) (rate(http_request_duration_seconds_bucket{job=~\"api-.*\", path!~\"/health.*|/metrics\"}[5m])))",
              "legendFormat": "{{job}} p95"
            },
            {
              "refId": "C",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.99, sum by (le, job) (rate(http_request_duration_seconds_bucket{job=~\"api-.*\", path!~\"/health.*|/metrics\"}[5m])))",
              "legendFormat": "{{job}} p99"
            }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Distribuição de status code",
          "description": "Inclui health checks: os 503 de readiness (banco fora) aparecem aqui.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 13,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 60,
                "stacking": {
                  "mode": "normal"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (status) (rate(http_requests_total{job=~\"api-.*\"}[2m]))",
              "legendFormat": "{{status}}"
            }
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Eventos de auditoria/s",
          "description": "A auditoria não exporta métricas HTTP; só auditoria_eventos_total e auditoria_arquivo_bytes.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 13,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (tipo) (rate(auditoria_eventos_total[2m]))",
              "legendFormat": "{{tipo}}"
            }
          ]
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "CPU por pod (tipsbank-*)",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 21,
            "w": 12,
            "h": 9
          },
          "fieldConfig": {
            "defaults": {
              "unit": "cores",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (namespace, pod) (rate(container_cpu_usage_seconds_total{namespace=~\"tipsbank-.*\", namespace!=\"tipsbank-monitoring\", container!=\"\"}[2m]))",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Memória (working set) por pod (tipsbank-*)",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 21,
            "w": 12,
            "h": 9
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (namespace, pod) (container_memory_working_set_bytes{namespace=~\"tipsbank-.*\", namespace!=\"tipsbank-monitoring\", container!=\"\"})",
              "legendFormat": "{{pod}}"
            }
          ]
        }
      ],
      "editable": true
    }
